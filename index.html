 "q": "¿Qué justificación asigna el cuadro al peritaje?", "options": ["Examen real y directo de hechos especificados en la prueba solicitada.", "Consejos generales basados solo en tendencias del mercado.", "Análisis de datos para recomendar actuaciones futuras.", "Aplicación de una sentencia judicial ya firme."], "answer": 0, "explanation": "El peritaje se justifica en el examen real y directo de hechos concretos vinculados con la prueba solicitada."}, {"id": 41, "topic": "Consultoría, auditoría y peritaje", "page": 16, "type": "mc", "q": "¿Cómo denomina el cuadro de la página 16 al contenido del peritaje?", "options": ["Opinión subjetiva.", "Opinión objetiva.", "Consejo o asesoría.", "Directriz recomendada."], "answer": 0, "explanation": "Esta es la etiqueta literal del cuadro. No autoriza parcialidad: las páginas 6 y 13 también exigen objetividad al perito y al dictamen."}, {"id": 42, "topic": "Seguridad de la información", "page": 17, "type": "mc", "q": "¿Qué tres propiedades busca garantizar la seguridad informática?", "options": ["Integridad, disponibilidad y confidencialidad.", "Rentabilidad, publicidad y distribución.", "Anonimato, reproducción y transformación.", "Autenticación, sorteo y ratificación."], "answer": 0, "explanation": "El PDF define la seguridad informática alrededor de integridad, disponibilidad y confidencialidad."}, {"id": 43, "topic": "Seguridad de la información", "page": 17, "type": "mc", "q": "Una base de datos sufre cambios accidentales. ¿Qué propiedad resulta afectada?", "options": ["Integridad.", "Disponibilidad únicamente.", "Confidencialidad únicamente.", "Titularidad."], "answer": 0, "explanation": "La integridad implica que los datos no sufran cambios no autorizados o accidentales."}, {"id": 44, "topic": "Seguridad de la información", "page": 17, "type": "mc", "q": "Un sistema deja de estar operativo cuando se lo necesita. ¿Qué propiedad se ve afectada?", "options": ["Disponibilidad.", "Confidencialidad.", "Derecho moral.", "Secreto comercial."], "answer": 0, "explanation": "La disponibilidad se vincula en el apunte con la continuidad operativa."}, {"id": 45, "topic": "Seguridad de la información", "page": 17, "type": "mc", "q": "Se divulga información a personas no autorizadas. ¿Qué propiedad se vulnera?", "options": ["Confidencialidad.", "Disponibilidad.", "Reproducción.", "Recusación."], "answer": 0, "explanation": "La confidencialidad busca evitar la divulgación no autorizada."}, {"id": 46, "topic": "Seguridad de la información", "page": 18, "type": "mc", "q": "¿Qué tipo de información se relaciona especialmente con riesgos para la intimidad en el cuadro?", "options": ["Bases de datos nominativas.", "Programas y aplicativos.", "Datos contables.", "Conocimiento tecnológico adquirido."], "answer": 0, "explanation": "Las bases de datos nominativas se vinculan en el cuadro con atentados a la intimidad de las personas."}, {"id": 47, "topic": "Seguridad de la información", "page": 18, "type": "mc", "q": "¿Qué aspecto de la seguridad incluye cifrado y firma electrónica en el esquema?", "options": ["Lógico.", "Físico.", "Técnico-organizativo.", "Comercial."], "answer": 0, "explanation": "El esquema ubica el cifrado y la firma electrónica en el aspecto lógico."}, {"id": 48, "topic": "Seguridad de la información", "page": 18, "type": "mc", "q": "¿En qué aspecto ubica el apunte los procedimientos de seguridad?", "options": ["Técnico-organizativo.", "Físico.", "Patrimonial.", "Mercantil."], "answer": 0, "explanation": "El sistema de seguridad contempla aspectos físicos, lógicos, técnico-organizativos y jurídicos; los procedimientos aparecen en el tercero."}, {"id": 49, "topic": "Protección jurídica y software", "page": 19, "type": "mc", "q": "¿Qué conjunto contiene mecanismos de protección jurídica de la información citados?", "options": ["Estipulaciones contractuales, secreto comercial y protección de datos personales.", "Snapshots, análisis de RAM y captura de tráfico.", "Sorteo de peritos, notificación y ratificación.", "Copia de memoria, muestreo y revisión de programas."], "answer": 0, "explanation": "La protección jurídica se articula mediante normas, leyes y decretos sobre contratos, secretos, patentes, marcas y datos personales, entre otros."}, {"id": 50, "topic": "Protección jurídica y software", "page": 20, "type": "mc", "q": "Según la tabla del apunte, ¿qué ley incluye programas de computación en la protección de propiedad intelectual?", "options": ["25.036.", "25.506.", "26.388.", "26.904."], "answer": 0, "explanation": "La tabla atribuye a la Ley 25.036 la modificación de la Ley 11.723 para incluir programas de computación. Se evalúa la asociación presentada en el material."}, {"id": 51, "topic": "Protección jurídica y software", "page": 20, "type": "mc", "q": "Según la tabla del apunte, ¿con qué tema se vincula la Ley 25.506?", "options": ["Documentos y firmas digitales.", "Grooming.", "Servicio de comunicaciones móviles.", "Confidencialidad de información y productos."], "answer": 0, "explanation": "La asociación temática del material para la Ley 25.506 es documentos y firmas digitales; esta pregunta no reproduce otras descripciones de la tabla."}, {"id": 52, "topic": "Protección jurídica y software", "page": 20, "type": "mc", "q": "¿Qué ley asocia el apunte con delitos informáticos en 2008?", "options": ["26.388.", "25.036.", "25.891.", "24.766."], "answer": 0, "explanation": "La tabla relaciona la Ley 26.388, de 2008, con la inclusión de delitos informáticos en el Código Penal."}, {"id": 53, "topic": "Protección jurídica y software", "page": 21, "type": "mc", "q": "¿Qué objetivo atribuye el material al Convenio de Budapest?", "options": ["Encontrar respuestas comunes ante el desarrollo de las TIC.", "Reemplazar toda legislación local por contratos privados.", "Regular únicamente la compraventa de computadoras.", "Establecer las etapas de todo informe pericial."], "answer": 0, "explanation": "El PDF describe respuestas comunes basadas en normas y valores del Consejo de Europa e insta a desarrollar legislación local."}, {"id": 54, "topic": "Protección jurídica y software", "page": 22, "type": "mc", "q": "¿Cuál es un ejemplo de protección física del software en el apunte?", "options": ["Llaves físicas y puertas con códigos de apertura.", "Contraseñas de acceso al programa.", "Cláusulas contractuales de uso.", "Derechos de autor sobre el código."], "answer": 0, "explanation": "El esquema ubica llaves físicas y puertas con códigos dentro de protección física."}, {"id": 55, "topic": "Protección jurídica y software", "page": 22, "type": "mc", "q": "¿Qué ejemplo pertenece a protección lógica del software?", "options": ["Contraseñas o llaves lógicas.", "Puertas con códigos de apertura.", "Derecho de marcas y patentes.", "Estipulaciones contractuales."], "answer": 0, "explanation": "La protección lógica usa cerraduras o llaves lógicas, como passwords."}, {"id": 56, "topic": "Protección jurídica y software", "page": 23, "type": "mc", "q": "¿Cuál es un derecho moral enumerado?", "options": ["Exigir el reconocimiento de la condición de autor.", "Distribuir comercialmente copias de la obra.", "Autorizar la reproducción de la obra.", "Explotar la comunicación pública de la obra."], "answer": 0, "explanation": "El reconocimiento de la autoría es moral; reproducción, distribución, comunicación pública y transformación se enumeran como patrimoniales."}, {"id": 57, "topic": "Protección jurídica y software", "page": 23, "type": "mc", "q": "¿Cuál de estos conjuntos reúne derechos patrimoniales del PDF?", "options": ["Reproducción, distribución, comunicación pública y transformación.", "Reconocimiento de autoría, integridad, nombre y divulgación.", "Ética, experiencia, objetividad y conocimiento.", "Confidencialidad, disponibilidad, integridad y responsabilidad."], "answer": 0, "explanation": "Son las cuatro categorías listadas bajo derechos patrimoniales o de explotación."}, {"id": 58, "topic": "Protección jurídica y software", "page": 24, "type": "mc", "q": "Según el esquema, ¿a quién corresponde la explotación de software creado en relación laboral, salvo pacto en contrario?", "options": ["Al empresario.", "A todos los usuarios del programa.", "A la autoridad judicial.", "Al proveedor del sistema operativo."], "answer": 0, "explanation": "El esquema atribuye al empresario la titularidad de los derechos de explotación en relación laboral, salvo pacto en contrario. No equipara esto con los derechos morales."}, {"id": 59, "topic": "Protección jurídica y software", "page": 24, "type": "mc", "q": "¿Cómo se determina la titularidad en una relación mercantil, según el PDF?", "options": ["Según lo estipulado en el contrato.", "Siempre por sorteo entre los contratantes.", "Siempre a favor del usuario final.", "Según la herramienta de desarrollo utilizada."], "answer": 0, "explanation": "La relación mercantil se rige por lo estipulado en el contrato, de acuerdo con el cuadro del material."}, {"id": 60, "topic": "Seguros informáticos", "page": 25, "type": "mc", "q": "¿Qué conjunto aparece asociado a riesgos de hardware en el esquema de seguros?", "options": ["Fuego, agua, explosión, robo y electricidad.", "Errores de programación, instalación e interoperabilidad.", "Falso testimonio, cohecho y recusación.", "Reproducción, distribución y transformación."], "answer": 0, "explanation": "Los riesgos de hardware incluyen daños por fuego, agua, explosión, robo y electricidad, entre otros."}, {"id": 61, "topic": "Peritos", "page": 3, "type": "vf", "q": "La extracción de información de dispositivos electrónicos figura entre las funciones del perito informático.", "options": ["Verdadero", "Falso"], "answer": 0, "explanation": "El listado de funciones incluye expresamente la extracción de información de dispositivos electrónicos."}, {"id": 62, "topic": "Peritos", "page": 4, "type": "vf", "q": "El perito de oficio y el perito de parte son nombrados por el mismo actor según el cuadro.", "options": ["Verdadero", "Falso"], "answer": 1, "explanation": "El perito de oficio es nombrado por el juzgado; el de parte, por particulares, personas físicas o empresas."}, {"id": 63, "topic": "Peritos", "page": 6, "type": "vf", "q": "El conocimiento técnico por sí solo reemplaza la ética y la responsabilidad del perito.", "options": ["Verdadero", "Falso"], "answer": 1, "explanation": "La actuación pericial se apoya en ética, objetividad, experiencia, conocimiento y responsabilidad."}, {"id": 64, "topic": "Peritos", "page": 7, "type": "vf", "q": "La responsabilidad profesional se vincula al incumplimiento del código deontológico aceptado.", "options": ["Verdadero", "Falso"], "answer": 0, "explanation": "Es la relación que establece la diapositiva sobre responsabilidades y sanciones."}, {"id": 65, "topic": "Peritos", "page": 7, "type": "vf", "q": "Según los ejemplos del PDF, el cohecho se vincula a sobornar a un juez.", "options": ["Verdadero", "Falso"], "answer": 0, "explanation": "La diapositiva lo presenta como ejemplo dentro de responsabilidad penal; no es una definición exhaustiva del delito."}, {"id": 66, "topic": "Pericia y etapas", "page": 8, "type": "vf", "q": "El peritaje informático solo puede aplicarse a asuntos judiciales.", "options": ["Verdadero", "Falso"], "answer": 1, "explanation": "La definición incluye asuntos judiciales y extrajudiciales."}, {"id": 67, "topic": "Pericia y etapas", "page": 8, "type": "vf", "q": "El análisis de evidencias digitales utiliza métodos científicos y de informática forense.", "options": ["Verdadero", "Falso"], "answer": 0, "explanation": "Ambos aparecen expresamente en la definición de la disciplina."}, {"id": 68, "topic": "Pericia y etapas", "page": 9, "type": "vf", "q": "Los conflictos laborales son una de las aplicaciones del peritaje informático listadas.", "options": ["Verdadero", "Falso"], "answer": 0, "explanation": "También se incluyen delitos informáticos, propiedad intelectual, datos personales, fraudes e investigaciones privad s no autorizados o accidentales."}, {"id": 82, "topic": "Seguridad de la información", "page": 17, "type": "vf", "q": "La confidencialidad consiste en asegurar la continuidad operativa de un servicio.", "options": ["Verdadero", "Falso"], "answer": 1, "explanation": "La continuidad operativa corresponde a disponibilidad; la confidencialidad evita divulgación no autorizada."}, {"id": 83, "topic": "Seguridad de la información", "page": 18, "type": "vf", "q": "El sistema de seguridad de la información contempla también aspectos jurídicos.", "options": ["Verdadero", "Falso"], "answer": 0, "explanation": "El esquema incluye los aspectos físico, lógico, técnico-organizativo y jurídico."}, {"id": 84, "topic": "Seguridad de la información", "page": 18, "type": "vf", "q": "El know how aparece como un tipo de información y se refiere a conocimiento adquirido.", "options": ["Verdadero", "Falso"], "answer": 0, "explanation": "El apunte lo presenta como conocimiento adquirido y lo vincula al riesgo de transferencia ilícita de tecnología."}, {"id": 85, "topic": "Protección jurídica y software", "page": 22, "type": "vf", "q": "El derecho de autor y el secreto comercial aparecen dentro de la protección jurídica del software.", "options": ["Verdadero", "Falso"], "answer": 0, "explanation": "El esquema los agrupa junto a estipulaciones contractuales y derechos de marcas y patentes."}, {"id": 86, "topic": "Protección jurídica y software", "page": 23, "type": "vf", "q": "Exigir el respeto a la integridad de la obra es un derecho patrimonial en la clasificación del PDF.", "options": ["Verdadero", "Falso"], "answer": 1, "explanation": "Figura entre los derechos morales; la transformación aparece entre los patrimoniales."}, {"id": 87, "topic": "Protección jurídica y software", "page": 23, "type": "vf", "q": "El autor puede decidir divulgar con su nombre, bajo seudónimo o anónimamente según los derechos morales listados.", "options": ["Verdadero", "Falso"], "answer": 0, "explanation": "La diapositiva enumera esas posibilidades dentro de los derechos morales."}, {"id": 88, "topic": "Protección jurídica y software", "page": 24, "type": "vf", "q": "En el esquema, si el software tiene varios autores, la propiedad es común en la proporción que determinen.", "options": ["Verdadero", "Falso"], "answer": 0, "explanation": "Es la descripción incluida para Varios Autores."}, {"id": 89, "topic": "Protección jurídica y software", "page": 24, "type": "vf", "q": "El esquema atribuye la titularidad al propio autor cuando no hay ningún tipo de relación.", "options": ["Verdadero", "Falso"], "answer": 0, "explanation": "El cuadro presenta esa regla para la categoría Sin Ningún Tipo de Relación."}, {"id": 90, "topic": "Seguros informáticos", "page": 25, "type": "vf", "q": "Los errores de programación e interoperabilidad aparecen entre los riesgos de software del esquema de seguros.", "options": ["Verdadero", "Falso"], "answer": 0, "explanation": "El esquema incluye además errores de consultores e instalación, fraudes del personal y suspensión del servicio de mantenimiento."}];
const KEY='peritaje-estudio-v1';
const topics=[...new Set(BANK.map(q=>q.topic))];
const app=document.querySelector('#app');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
let data={wrong:[],history:[],session:null};let storageOK=true;let ticker=null;let session=null;
try{const saved=JSON.parse(localStorage.getItem(KEY));if(saved&&Array.isArray(saved.wrong)&&Array.isArray(saved.history)){data=saved;data.wrong=data.wrong.filter(id=>BANK.some(q=>q.id===id));if(data.session&&!validSession(data.session))data.session=null}}catch(e){storageOK=false}
function validSession(s){return s&&Array.isArray(s.items)&&s.items.length>0&&s.items.every(it=>{const q=BANK.find(x=>x.id===it.id);return q&&Array.isArray(it.order)&&it.order.length===q.options.length&&new Set(it.order).size===q.options.length&&it.order.every(i=>Number.isInteger(i)&&i>=0&&i<q.options.length)&&(it.choice===null||it.order.includes(it.choice))})&&Number.isInteger(s.pos)&&s.pos>=0&&s.pos<s.items.length&&['practice','exam'].includes(s.mode)}
function save(){data.session=session;try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){storageOK=false}}
function stopTimer(){if(ticker)clearInterval(ticker);ticker=null}
function topicOptions(){return '<option value="all">Todos los temas</option>'+topics.map(t=>`<option value="${esc(t)}">${esc(t)}</option>`).join('')}
function shellFooter(){return `<footer>Banco elaborado a partir de «Peritaje Informático-Clase Teórica.pdf» (25 páginas). Preguntas de práctica originales: no son preguntas oficiales ni una predicción del examen. Las referencias usan la página del archivo PDF.</footer>`}
function home(){stopTimer();session=null;app.innerHTML=`<div class="intro"><span class="eyebrow">Entender. Practicar. Llegar con confianza.</span><h1>Tu próximo examen,<br>una pregunta a la vez.</h1><p class="muted">Peritos, evidencia digital, dictámenes y seguridad informática. Elegí un tema o mezclá toda la unidad.</p></div><div class="stats"><div class="stat"><strong>90</strong><span>preguntas con explicación</span></div><div class="stat"><strong>60 + 30</strong><span>opción múltiple + V/F</span></div><div class="stat"><strong>${data.wrong.length}</strong><span>errores para repasar</span></div></div>${data.session?`<div class="resume row between"><div><strong>Tenés una sesión pendiente</strong><br><span class="source">${data.session.mode==='exam'?'Examen':'Práctica'} · ${data.session.items.filter(i=>i.choice!==null).length}/${data.session.items.length} respondidas${data.session.deadline?' · El tiempo sigue contando al cerrar.':''}</span></div><button class="primary" id="resume">Continuar sesión</button></div>`:''}<div class="grid"><section class="card"><h2>Armá tu sesión</h2><p class="muted">Una sola respuesta correcta por pregunta. Las opciones se mezclan en cada intento.</p><div class="fields"><div class="field-wide"><label for="topic">Tema</label><select id="topic">${topicOptions()}</select></div><div><label for="mode">Modalidad</label><select id="mode"><option value="practice">Práctica · corrección al responder</option><option value="exam">Examen · corrección al finalizar</option></select></div><div><label for="type">Tipo de preguntas</label><select id="type"><option value="all">Mixtas</option><option value="mc">Opción múltiple</option><option value="vf">Verdadero / falso</option></select></div><div><label for="count">Cantidad</label><select id="count"><option>10</option><option selected>20</option><option>40</option><option value="all">Todas las disponibles</option></select></div><div><label for="duration">Tiempo del examen</label><select id="duration" disabled><option value="0">Sin límite</option><option value="15">15 minutos</option><option value="30">30 minutos</option><option value="45">45 minutos</option></select></div></div><p id="available" class="source"></p><div class="row"><button class="primary" id="start">Empezar sesión →</button><button id="mistakes" ${!data.wrong.length?'disabled':''}>Repasar errores (${data.wrong.length})</button></div><p class="source">El repaso usa todos tus errores pendientes, sin aplicar los filtros. Cada acierto los quita de esa lista.</p><p id="toast" role="status"></p></section><aside class="card"><span class="eyebrow">Tu recorrido</span><h2 style="margin-top:8px">Últimos intentos</h2>${data.history.length?data.history.slice(0,5).map(h=>`<div class="history"><div class="row between"><strong>${h.score}/${h.total} · ${Math.round(h.score/h.total*100)}%</strong><span class="badge">${h.mode==='exam'?'Examen':'Práctica'}</span></div><span class="source">${esc(new Date(h.date).toLocaleString('es-AR'))}</span></div>`).join(''):'<p class="muted">Tu historial aparece acá al finalizar una sesión.</p>'}<p class="source">El avance se guarda en este navegador y dispositivo. No se sincroniza con otros equipos. ${storageOK?'':'El navegador bloqueó el almacenamiento: el avance puede perderse al cerrar.'}</p><button id="bank">Explorar las 90 preguntas</button><details class="guide"><summary><strong>Sobre el apunte y sus matices</strong></summary><p>El cuadro de la página 16 llama “subjetiva” a la opinión pericial. Las páginas 6 y 13 exigen objetividad. La pregunta sobre ese cuadro aclara la distinción.</p><p>La tabla legislativa (p. 20) contiene un número dudoso para protección de datos personales: “25.286”. No se pregunta ese número. Las referencias normativas son material de estudio del PDF; no constituyen una revisión de legislación vigente.</p><p>Se omiten afirmaciones ambiguas sobre obra colectiva y fechas de legislación europea. Conviene consultar esos puntos con la docente.</p></details><details class="guide"><summary><strong>Abrir o subir este HTML</strong></summary><p>En la computadora: abrí este archivo con un navegador. Todo el contenido está incluido; no necesita instalar nada ni conectarse a Internet.</p><p>Para publicarlo: renombrá el archivo a <b>index.html</b> y subilo a un alojamiento de sitios estáticos, por ejemplo el que uses con GitHub Pages. No requiere servidor de aplicación ni base de datos.</p><p>En el celular: accedé a la dirección publicada y guardala en favoritos. Un enlace online requiere conexión para cargar; también podés descargar el archivo y abrirlo localmente si tu navegador lo permite.</p></details><button class="quiet danger" id="clear">Borrar mi progreso</button></aside></div>${shellFooter()}`;
 document.querySelector('#mode').onchange=()=>{document.querySelector('#duration').disabled=document.querySelector('#mode').value!=='exam'};
 ['topic','type'].forEach(id=>document.getElementById(id).onchange=updateAvailable);updateAvailable();
 document.querySelector('#start').onclick=()=>{if(data.session&&!confirm('Empezar una sesión nueva reemplazará la sesión pendiente. ¿Continuar?'))return;start(filtered(),document.querySelector('#mode').value,document.querySelector('#count').value,Number(document.querySelector('#duration').value))};
 document.querySelector('#mistakes').onclick=()=>{if(data.session&&!confirm('El repaso reemplazará la sesión pendiente. ¿Continuar?'))return;start(BANK.filter(q=>data.wrong.includes(q.id)),'practice','all',0)};
 const resume=document.querySelector('#resume');if(resume)resume.onclick=()=>{session=data.session;renderQuestion();runTimer()};
 document.querySelector('#bank').onclick=showBank;
 document.querySelector('#clear').onclick=()=>{if(confirm('¿Borrar historial, errores y sesión pendiente de este navegador?')){data={wrong:[],history:[],session:null};save();home()}};
}
function filtered(){const t=document.querySelector('#topic').value;const k=document.querySelector('#type').value;return BANK.filter(q=>(t==='all'||q.topic===t)&&(k==='all'||q.type===k))}
function updateAvailable(){document.querySelector('#available').textContent=filtered().length+' preguntas disponibles con estos filtros. Si pedís más, se usan todas las disponibles.'}
function start(pool,mode,count,minutes){if(!pool.length)return;const selected=shuffle(pool).slice(0,count==='all'?pool.length:Number(count));session={mode,pos:0,started:Date.now(),deadline:mode==='exam'&&minutes>0?Date.now()+minutes*60000:null,items:selected.map(q=>({id:q.id,order:q.type==='mc'?shuffle(q.options.map((_,i)=>i)):[0,1],choice:null,checked:false}))};save();renderQuestion();runTimer()}
function current(){const it=session.items[session.pos];return {it,q:BANK.find(x=>x.id===it.id)}}
function renderQuestion(){const {it,q}=current();const answered=session.items.filter(i=>i.choice!==null).length;app.innerHTML=`<section class="quiz"><div class="row between topline"><button class="quiet" id="home">← Guardar y volver</button><div class="row"><span class="badge">${session.mode==='exam'?'Modo examen':'Modo práctica'}</span>${session.deadline?'<span id="timer" class="timer"></span>':''}</div></div><div class="row between"><span class="eyebrow">Pregunta ${session.pos+1} de ${session.items.length}</span><span class="source">${answered} respondidas</span></div><div class="progress"><div style="width:${answered/session.items.length*100}%"></div></div><article class="card"><div class="row between"><span class="badge">${esc(q.topic)}</span><span class="source">${q.type==='mc'?'Opción múltiple':'Verdadero / falso'}</span></div><h2 id="question" class="question" tabindex="-1">${esc(q.q)}</h2><fieldset class="choices"><legend class="sr">Seleccioná una respuesta</legend>${it.order.map((idx,position)=>{let cls=it.choice===idx?' selected':'';if(it.checked){if(idx===q.answer)cls+=' correct';else if(idx===it.choice)cls+=' wrong'}return `<button type="button" class="option${cls}" data-answer="${idx}" aria-pressed="${it.choice===idx}" ${it.checked?'disabled':''}><span class="letter">${q.type==='mc'?'ABCD'[position]:position===0?'V':'F'}</span><span>${esc(q.options[idx])}${it.checked&&idx===q.answer?' <strong>✓ Respuesta correcta</strong>':''}${it.checked&&idx===it.choice&&idx!==q.answer?' <strong>✕ Tu respuesta</strong>':''}</span></button>`}).join('')}</fieldset>${it.checked?`<div class="feedback ${it.choice===q.answer?'':'bad'}" role="status"><strong>${it.choice===q.answer?'¡Bien! Respuesta correcta.':'Esta era para repasar.'}</strong><p>${esc(q.explanation)}</p><p class="source">Referencia: página ${q.page} del PDF.</p></div>`:''}<div class="row between actions"><button id="prev" ${session.pos===0?'disabled':''}>← Anterior</button><div class="row">${session.mode==='practice'&&!it.checked?`<button class="primary" id="check" ${it.choice===null?'disabled':''}>Comprobar</button>`:''}<button id="next">${session.pos===session.items.length-1?'Ver resultado →':it.choice===null?'Saltar →':'Siguiente →'}</button></div></div></article><nav aria-label="Ir a una pregunta" class="numbers">${session.items.map((x,i)=>{const target=BANK.find(q=>q.id===x.id);return `<button class="${x.choice!==null?'answered ':''}${i===session.pos?'current ':''}${x.checked&&x.choice!==target.answer?'failed':''}" data-go="${i}" ${i===session.pos?'aria-current="step"':''} aria-label="Pregunta ${i+1}${x.choice===null?', sin responder':', respondida'}">${i+1}</button>`}).join('')}</nav><div class="row between actions"><span class="source">${session.mode==='practice'?'Comprobá para ver la explicación. Podés saltar y volver.':'Podés cambiar tus respuestas hasta finalizar.'}</span><button class="quiet" id="finish">Finalizar intento</button></div>${shellFooter()}</section>`;
 document.querySelector('#home').onclick=()=>{save();home()};
 document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{it.choice=Number(b.dataset.answer);save();renderQuestion()});
 document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(Number(b.dataset.go)));
 const check=document.querySelector('#check');if(check)check.onclick=()=>{it.checked=true;save();renderQuestion()};
 document.querySelector('#prev').onclick=()=>go(session.pos-1);
 document.querySelector('#next').onclick=()=>{if(session.pos===session.items.length-1)finish(false);else go(session.pos+1)};
 document.querySelector('#finish').onclick=()=>finish(false);updateTimer();
}
function go(pos){session.pos=pos;save();renderQuestion();document.querySelector('#question').focus();window.scrollTo({top:0,behavior:'auto'})}
function runTimer(){stopTimer();if(session&&session.deadline){updateTimer();ticker=setInterval(()=>{if(!session)return stopTimer();if(Date.now()>=session.deadline){finish(true)}else updateTimer()},1000)}}
function updateTimer(){if(!session||!session.deadline)return;const el=document.querySelector('#timer');if(!el)return;const secs=Math.max(0,Math.ceil((session.deadline-Date.now())/1000));el.textContent=Math.floor(secs/60)+':'+String(secs%60).padStart(2,'0');el.classList.toggle('low',secs<120)}
function finish(expired){const pending=session.items.filter(i=>i.choice===null).length;const unchecked=session.mode==='practice'?session.items.filter(i=>i.choice!==null&&!i.checked).length:0;if(!expired&&(pending||unchecked)&&!confirm(`Quedan ${pending} sin responder${unchecked?' y '+unchecked+' sin comprobar':''}. Se corregirá todo y las omitidas contarán como error. ¿Finalizar?`))return;stopTimer();const completed=JSON.parse(JSON.stringify(session));let score=0;completed.items.forEach(it=>{const q=BANK.find(x=>x.id===it.id);const ok=it.choice===q.answer;if(ok){score++;data.wrong=data.wrong.filter(id=>id!==q.id)}else if(!data.wrong.includes(q.id))data.wrong.push(q.id)});data.history.unshift({date:Date.now(),mode:completed.mode,score,total:completed.items.length});data.history=data.history.slice(0,15);session=null;save();results(completed,score,expired)}
function reviewItem(it,index){const q=BANK.find(x=>x.id===it.id);const ok=it.choice===q.answer;return `<details class="review" ${ok?'':'open'}><summary><span class="${ok?'goodtext':'badtext'}">${ok?'✓':'✕'}</span> ${index+1}. ${esc(q.q)}</summary><p><b>Tu respuesta:</b> ${it.choice===null?'Sin responder':esc(q.options[it.choice])}</p>${ok?'':`<p class="goodtext"><b>Correcta:</b> ${esc(q.options[q.answer])}</p>`}<p>${esc(q.explanation)}</p><p class="source">${esc(q.topic)} · Página ${q.page} del PDF.</p></details>`}
function results(done,score,expired){const pct=Math.round(score/done.items.length*100);const wrong=done.items.filter(i=>i.choice!==BANK.find(q=>q.id===i.id).answer);app.innerHTML=`<section class="quiz"><div class="card"><span class="eyebrow">Intento finalizado${expired?' · Tiempo agotado':''}</span><h1>Así venís.</h1><div class="score">${pct}%</div><p><b>${score} correctas</b> de ${done.items.length} · ${done.items.length-score} incorrectas u omitidas.</p><p class="muted">${pct>=85?'Buen dominio de esta selección. Probá otra mezcla o revisá los temas que faltan.':pct>=60?'Hay una base. El próximo paso es volver sobre las explicaciones de tus errores.':'Usá las explicaciones y sus páginas para repasar antes del próximo intento.'} Este porcentaje es orientativo; no representa una nota oficial.</p><div class="row actions"><button class="primary" id="again">Nueva sesión</button><button id="retry" ${wrong.length?'':'disabled'}>Reintentar estos errores (${wrong.length})</button></div></div><h2 style="margin-top:28px">Revisión del intento</h2><p class="source">Los errores están desplegados. Abrí los aciertos para consultar su explicación.</p><label class="checkbox"><input id="wrongOnly" type="checkbox">Ver solo errores u omitidas</label><div id="reviews">${done.items.map(reviewItem).join('')}</div>${shellFooter()}</section>`;document.querySelector('#again').onclick=home;document.querySelector('#retry').onclick=()=>start(wrong.map(it=>BANK.find(q=>q.id===it.id)),'practice','all',0);document.querySelector('#wrongOnly').onchange=e=>{document.querySelector('#reviews').innerHTML=done.items.map((it,i)=>(!e.target.checked||wrong.includes(it))?reviewItem(it,i):'').join('')};window.scrollTo(0,0)}
function showBank(){stopTimer();app.innerHTML=`<section class="quiz"><button class="quiet" id="back">← Volver al inicio</button><h1>Todo el banco.</h1><p class="muted">90 preguntas. Cada respuesta incluye una explicación y la página para volver al apunte.</p><div class="bank-controls"><label for="bankTopic">Filtrar por tema</label><select id="bankTopic">${topicOptions()}</select></div><div id="bankItems"></div>${shellFooter()}</section>`;const draw=()=>{const t=document.querySelector('#bankTopic').value;document.querySelector('#bankItems').innerHTML=BANK.filter(q=>t==='all'||q.topic===t).map(q=>`<details class="review"><summary>${q.id}. ${esc(q.q)}</summary>${q.options.map((s,i)=>`<p>${q.type==='mc'?'ABCD'[i]+'. ':''}${esc(s)}</p>`).join('')}<p class="goodtext"><b>Respuesta: ${esc(q.options[q.answer])}</b></p><p>${esc(q.explanation)}</p><p class="source">${esc(q.topic)} · Página ${q.page} del PDF.</p></details>`).join('')};draw();document.querySelector('#bankTopic').onchange=draw;document.querySelector('#back').onclick=home;window.scrollTo(0,0)}
home();
</script>
</body>
</html>
